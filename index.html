<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040e1e">
<title>WhiteBox</title>
<meta name="description" content="每天一次，三张运势卡。开包、撕封条、翻牌，看今天宇宙怎么安排你。">
<style>
/* ============================================================
   WhiteBox
   视觉参考：深海军蓝丝绸 / 全息箔撕口卡包 / 老式收藏卡 / 白色胶囊
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy-0:#030b18;
  --navy-1:#061529;
  --navy-2:#0b2145;
  --navy-3:#12315f;
  --blue:#1c3fd8;
  --blue-lt:#3d63ff;
  --ink:#eef4ff;
  --dim:rgba(186,208,245,.62);
  --dimmer:rgba(160,186,230,.38);
  --glass:rgba(7,22,46,.62);
  --stroke:rgba(122,166,255,.22);
  --stroke-2:rgba(122,166,255,.34);
  --olive:#6d6d46;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:var(--font);
  background:var(--navy-0);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:manipulation;
}

/* ============ 背景：丝绸 ============ */
.bg-silk{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(115% 78% at 50% -8%, #1d4479 0%, #12305c 26%, #0a1c39 52%, #05101f 78%, #030b18 100%);
}
.bg-silk i{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 42% 40%, #3f7fd6 0%, rgba(45,100,180,.35) 42%, rgba(10,30,60,0) 70%);
  filter:blur(52px);opacity:.55;
  animation:drift 26s ease-in-out infinite alternate;
}
.bg-silk i:nth-child(1){width:420px;height:300px;left:-14%;top:6%;transform:rotate(-18deg)}
.bg-silk i:nth-child(2){width:380px;height:260px;right:-18%;top:22%;animation-delay:-6s;opacity:.42}
.bg-silk i:nth-child(3){width:520px;height:340px;left:-10%;bottom:2%;animation-delay:-12s;opacity:.38;transform:rotate(12deg)}
.bg-silk i:nth-child(4){width:300px;height:220px;right:2%;bottom:16%;animation-delay:-3s;opacity:.34}
.bg-silk i:nth-child(5){width:460px;height:280px;left:26%;top:44%;animation-delay:-18s;opacity:.26}
.bg-silk::after{
  content:"";position:absolute;inset:-25%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='760' height='760'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.005 0.011' numOctaves='4' seed='11'/><feColorMatrix type='saturate' values='0'/></filter><rect width='760' height='760' filter='url(%23f)'/></svg>");
  background-size:760px 760px;
  mix-blend-mode:overlay;opacity:.5;
  filter:contrast(1.7) brightness(.9);
  pointer-events:none;
}
@keyframes drift{
  from{transform:translate3d(0,0,0) rotate(-8deg) scale(1)}
  to{transform:translate3d(30px,-24px,0) rotate(6deg) scale(1.12)}
}

/* ============ 布局 ============ */
.app{
  position:relative;z-index:2;
  height:100dvh;max-width:430px;margin:0 auto;
  padding:0 20px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* 结果页：收窄左右留白，给扇形卡牌让空间 */
.at-result .app{padding-left:10px;padding-right:10px}

/* ============ 顶栏 ============ */
.nav{
  display:flex;align-items:center;gap:10px;
  padding:14px 0 6px;flex:0 0 auto;
}
.nav-back{
  width:30px;height:30px;flex:0 0 auto;
  display:grid;place-items:center;
  background:none;border:0;color:#cfe0ff;cursor:pointer;
  opacity:.9;transition:opacity .2s;
}
.nav-back:active{opacity:.5}
.nav-logo{
  position:relative;display:flex;flex-direction:column;line-height:1;
  transform:rotate(-4deg);margin-left:2px;user-select:none;
}
.nl-top{
  font-size:9px;font-weight:900;letter-spacing:.16em;
  color:#fff;-webkit-text-stroke:2.6px var(--blue);
  paint-order:stroke fill;margin-bottom:-2px;margin-left:2px;
}
.nl-main{
  font-size:18px;font-weight:900;letter-spacing:-.03em;
  color:#fff;-webkit-text-stroke:4.2px var(--blue);
  paint-order:stroke fill;
  text-shadow:0 2px 0 rgba(12,30,90,.5);
}
.nav-tools{
  margin-left:auto;display:flex;align-items:center;gap:2px;
  background:var(--glass);border:1px solid var(--stroke);
  border-radius:99px;padding:5px 7px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
}
.nav-tools button{
  width:29px;height:29px;display:grid;place-items:center;
  background:none;border:0;color:rgba(210,226,255,.82);cursor:pointer;
  border-radius:50%;transition:background .2s,color .2s;
}
.nav-tools button:active{background:rgba(120,170,255,.16);color:#fff}

/* ============ 通用屏幕 ============ */
.screen{display:none;flex:1 1 auto;min-height:0;overflow:hidden;flex-direction:column}
.screen.active{display:flex;animation:screenIn .42s cubic-bezier(.22,.9,.3,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 首页 ============ */
.big-title{
  font-size:clamp(34px,6.4vh,54px);font-weight:800;letter-spacing:-.045em;
  text-align:center;color:#fff;margin-top:clamp(6px,1.4vh,14px);line-height:1;
  text-shadow:0 10px 34px rgba(0,20,60,.6);
}
.big-title .dot{color:#fff}
.tap-hint{
  text-align:center;flex:0 0 auto;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;
  color:var(--dim);margin-top:clamp(16px,3vh,26px);margin-bottom:clamp(10px,2vh,18px);
  animation:hintPulse 2.6s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}

.pack-stage{
  position:relative;flex:1 1 auto;min-height:0;margin-top:clamp(2px,.8vh,6px);
  display:flex;align-items:center;justify-content:center;
  perspective:1200px;
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
}
.pack-stage.dragging{cursor:grabbing}
/* 拖动时关闭过渡，卡包跟手；松手后恢复过渡做回弹/切包动画 */
.pack-stage.dragging .pack{transition:none}

/* 齿边 / 撕口 / logo / 张数 / 贴片全部由包装图承载，DOM 保留但不再绘制 */
.pk-edge,.pk-tear,.pk-series,.pk-logo,.pk-count,.pk-chip{display:none !important}

/* 今日已抽完时才显示下次抽卡倒计时；未抽时不占任何空间 */
.countdown{
  display:none;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  color:var(--dimmer);margin-top:clamp(6px,1.4vh,12px);
  margin-bottom:20px;
}
.countdown.show{display:block}

/* ============ 开卡页 ============ */
.draw-series{
  text-align:center;font-size:10px;font-weight:800;letter-spacing:.3em;
  color:var(--dim);margin-top:8px;
}
.bars{display:flex;gap:6px;margin:13px 14px 0}
.bars i{
  flex:1;height:9px;border-radius:2px;
  background:rgba(150,185,240,.12);
  border:1px solid rgba(130,170,235,.16);
  transition:background .4s,box-shadow .4s,border-color .4s;
}
.bars i.on{
  background:#fff;border-color:#fff;
  box-shadow:0 0 12px rgba(190,220,255,.75);
}

.draw-stage{
  position:relative;flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;
}

/* ============ 未拆卡包：包装图 + 顶部齿边封条，滑动撕开（Canvas 2.5D 渲染） ============ */

.raw-pack .rp-cv{
  position:absolute;left:-30%;top:-60%;width:160%;height:180%;
  z-index:4;pointer-events:none;
}

/* 透明热区：盖住整包，按住横滑即撕开；不绘制任何可见素材 */
.raw-pack .rp-tear{
  position:absolute;inset:0;z-index:6;
  background:none;border:0;box-shadow:none;border-radius:0;
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
.raw-pack .rp-tear.drag{cursor:grabbing}

/* ============ 卡背 ============ */
.card-back{
  position:relative;width:100%;height:100%;border-radius:9px;
  background:
    radial-gradient(84% 70% at 50% 46%, #16326b 0%, #0d1f47 46%, #08152f 100%);
  box-shadow:0 32px 54px -22px rgba(0,0,0,.9),0 0 0 1px rgba(140,185,255,.22) inset;
  overflow:hidden;
  display:grid;place-items:center;
}
/* 同心圆波纹 */
.card-back::before{
  content:"";position:absolute;inset:0;
  background:repeating-radial-gradient(circle at 50% 46%,
    rgba(120,170,255,.16) 0 1px, transparent 1px 7px);
  opacity:.9;
  mask-image:radial-gradient(circle at 50% 46%, #000 30%, transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 50% 46%, #000 30%, transparent 70%);
}
.card-back .cbframe{
  position:absolute;inset:9px;border:1px solid rgba(130,175,255,.32);border-radius:6px;
}
.card-back .cbframe::after{
  content:"";position:absolute;inset:5px;border:1px solid rgba(130,175,255,.14);border-radius:4px;
}
.card-back .cbring{
  position:relative;z-index:3;width:108px;height:108px;
  display:grid;place-items:center;border-radius:50%;
}
.card-back .cbring svg{position:absolute;inset:0;width:100%;height:100%}
.card-back .cbring .cbl{
  position:relative;display:flex;flex-direction:column;align-items:center;line-height:.9;
}
.card-back .cbring .cbl .l1{font-size:8px;font-weight:900;letter-spacing:.06em;color:#fff;-webkit-text-stroke:2px var(--blue);paint-order:stroke fill}
.card-back .cbring .cbl .l2{font-size:16px;font-weight:900;letter-spacing:-.05em;color:#fff;-webkit-text-stroke:4px var(--blue);paint-order:stroke fill}

/* ============ 卡牌正面 ============ */
.tcard{
  position:relative;width:100%;aspect-ratio:5/7;
  border-radius:9px;padding:8px;
  background:linear-gradient(168deg,#8a8a5e 0%,#71714a 34%,#5d5d39 70%,#4c4c2d 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.35) inset,
    0 1px 0 rgba(255,255,255,.32) inset,
    0 -2px 6px rgba(0,0,0,.4) inset,
    0 30px 50px -20px rgba(0,0,0,.9);
  display:flex;
}
.tc-frame{
  flex:1;display:flex;flex-direction:column;gap:3px;
  border-radius:5px;padding:4px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.12));
  box-shadow:0 0 0 1px rgba(30,30,10,.45) inset;
  overflow:hidden;
}
.tc-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:4px;
  padding:2px 2px 0;
}
.tc-name{
  font-size:15px;font-weight:900;letter-spacing:-.01em;line-height:1.1;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);
}
.tc-attr{
  flex:0 0 auto;width:18px;height:18px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#2b2b18,#141408);
  border:1px solid rgba(255,255,255,.28);
  font-size:9px;font-weight:900;color:#f5f0d8;
  box-shadow:0 1px 2px rgba(0,0,0,.5);
}
.tc-type{
  text-align:right;font-size:8.5px;font-weight:800;letter-spacing:.06em;
  color:#fff;opacity:.92;padding:0 3px 2px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.tc-art{
  position:relative;flex:1 1 auto;
  min-height:34%;margin:0 2px;
  border:1px solid rgba(30,30,12,.55);
  overflow:hidden;
  background:
    radial-gradient(90% 60% at 50% 18%, #4a7fb5 0%, #2c4f78 40%, #16283f 72%, #0b1522 100%);
  display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.1) inset;
}
.tc-art::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 120%, rgba(0,0,0,.6) 0%, transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.1), transparent 30%);
  pointer-events:none;
}
.tc-art .tca-emoji{
  font-size:58px;line-height:1;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));
  transform:translateY(-2px);
}
.tc-art .tca-sign{
  position:absolute;right:6px;bottom:4px;
  font-size:10px;font-style:italic;font-weight:700;
  color:rgba(255,255,255,.72);
  transform:rotate(-7deg);letter-spacing:.04em;
}
.tc-text{
  flex:0 0 auto;
  margin:2px;
  background:#f1efe2;
  border:1px solid rgba(40,40,20,.4);
  padding:6px 7px;
  display:flex;flex-direction:column;gap:3px;
}
.tct-desc{
  font-family:var(--mono);
  font-size:8.8px;line-height:1.52;color:#22221a;
  letter-spacing:-.02em;
}
.tct-advice{
  font-family:var(--mono);
  font-size:8px;line-height:1.5;color:#6a6a58;
  border-top:1px dashed rgba(80,80,50,.28);padding-top:3px;
}
.tc-foot{
  text-align:right;font-size:5.6px;letter-spacing:.06em;
  color:rgba(255,255,255,.42);padding:0 3px 1px;
  font-weight:700;
}

/* 稀有度 */
.tcard[data-rarity="R"]{background:linear-gradient(168deg,#8f9ec0 0%,#7183ab 40%,#5a6b93 100%)}
.tcard[data-rarity="SR"]{background:linear-gradient(168deg,#a08ac8 0%,#8268b4 38%,#63509a 100%)}
.tcard[data-rarity="SR"] .tc-frame{box-shadow:0 0 0 1px rgba(220,190,255,.5) inset,0 0 18px rgba(160,110,255,.35) inset}
.tcard[data-rarity="SSR"]{background:linear-gradient(150deg,#e8c878 0%,#c9a24a 26%,#8a6a28 58%,#c9a24a 100%)}
.tcard[data-rarity="SSR"] .tc-frame{box-shadow:0 0 0 1px rgba(255,235,170,.7) inset,0 0 22px rgba(255,210,90,.4) inset}
.tcard .holo{
  position:absolute;inset:0;border-radius:9px;pointer-events:none;z-index:4;
  opacity:.5;mix-blend-mode:overlay;
  background:linear-gradient(115deg,
    rgba(255,120,200,.5) 0%, rgba(120,220,255,.5) 22%,
    rgba(180,255,180,.45) 42%, rgba(255,240,150,.5) 62%,
    rgba(200,150,255,.5) 82%, rgba(120,220,255,.5) 100%);
  background-size:300% 300%;
  animation:holoShift 5s linear infinite;
}
@keyframes holoShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.tcard.pulse{animation:cardPulse 2.4s ease-in-out infinite}
@keyframes cardPulse{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,110,0))}
  50%{filter:drop-shadow(0 0 22px rgba(255,215,110,.75))}
}

/* 出卡容器：正面卡从包口直接升起到正中 */
.reveal{
  position:absolute;left:50%;top:50%;z-index:8;
  width:min(262px,36vh);aspect-ratio:5/7;
  transform:translate(-50%,26%) scale(.6);
  opacity:0;
  perspective:1200px;
  transition:transform .8s cubic-bezier(.22,1,.3,1),opacity .5s;
}
.reveal.rised{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}
/* 点击后放大（0,3,0 优先级高于 .rised，避免升起动画冲突） */
.reveal.rised.zoomed{
  transform:translate(-50%,-54%) scale(1.14);
}
.reveal.flippable{cursor:zoom-in}
.reveal .flip{
  position:relative;width:100%;height:100%;
  transform-style:flat;
}
.reveal .fc{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* ============ 卡牌背面：详解签文 ============ */
.detail-card{
  width:100%;height:100%;border-radius:9px;padding:9px;
  background:linear-gradient(160deg,#12325e 0%,#0a1e3e 55%,#061227 100%);
  box-shadow:
    0 0 0 1px rgba(200,170,110,.55) inset,
    0 1px 0 rgba(255,255,255,.18) inset,
    0 30px 50px -20px rgba(0,0,0,.9);
  display:flex;
}
.detail-card[data-rarity="R"]{background:linear-gradient(160deg,#143a63 0%,#0a2340 55%,#061427 100%)}
.detail-card[data-rarity="SR"]{background:linear-gradient(160deg,#2a1c4a 0%,#180f30 55%,#0c071c 100%)}
.detail-card[data-rarity="SSR"]{background:linear-gradient(160deg,#3a2c10 0%,#241a06 55%,#120c02 100%)}
.detail-card .dc-inner{
  flex:1;border:1px solid rgba(210,180,120,.4);border-radius:5px;
  padding:12px 13px;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(80% 50% at 50% 18%, rgba(110,160,235,.16), transparent 72%);
  overflow:hidden;
}
.dc-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.dc-tag{font-size:7.5px;font-weight:900;letter-spacing:.16em;color:rgba(200,220,255,.62)}
.dc-rarity{
  font-size:10px;font-weight:900;color:#f3d98a;
  border:1px solid rgba(230,200,130,.5);border-radius:99px;padding:2px 8px;
  background:rgba(230,190,90,.1);
}
.dc-emoji{
  font-size:52px;line-height:1;margin:10px 0 4px;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));
}
.dc-name{
  font-size:22px;font-weight:900;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.dc-meta{
  font-size:9px;font-weight:800;letter-spacing:.08em;
  color:rgba(180,210,255,.75);margin-top:4px;
}
.dc-rule{
  width:56%;height:1px;margin:12px 0 10px;
  background:linear-gradient(90deg,transparent,rgba(220,190,130,.7),transparent);
}
.dc-desc{
  font-size:12px;line-height:1.75;color:#f2ecd8;text-align:center;
  font-weight:700;padding:0 2px;
}
.dc-advice{
  margin-top:auto;width:100%;
  background:rgba(255,255,255,.07);border:1px dashed rgba(210,190,130,.35);
  border-radius:5px;padding:9px 10px;
  font-size:12px;line-height:1.6;color:#e8dfc4;text-align:center;
  font-weight:700;letter-spacing:.06em;
}
.dc-advice span{
  display:block;font-size:8px;font-weight:900;letter-spacing:.22em;
  color:#e8c877;margin-bottom:3px;
}
.dc-foot{
  font-size:7px;letter-spacing:.1em;color:rgba(180,200,235,.42);
  margin-top:8px;font-weight:700;
}

/* 左右切换已开的卡 */
.card-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:12;
  width:34px;height:52px;
  display:grid;place-items:center;
  background:rgba(6,18,38,.6);border:1px solid rgba(120,166,255,.2);
  color:rgba(200,222,255,.7);font-size:18px;border-radius:8px;
  cursor:pointer;backdrop-filter:blur(8px);
}
.card-nav.prev{left:-4px}
.card-nav.next{right:-4px}
.card-nav:active{background:rgba(120,170,255,.18);color:#fff}
.card-nav[disabled]{opacity:.25;pointer-events:none}

/* ============ 翻牌提示 & 滑动条 ============ */
.flip-hint{
  text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:rgba(196,216,250,.8);margin:2px 0 9px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .3s;
}
.flip-hint .ar{font-size:13px;opacity:.8}

/* ============ 出卡后的下一步按钮 ============ */
.next-cta{
  display:flex;justify-content:center;padding:4px 0 10px;
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .35s,transform .35s;
}
.next-cta.show{opacity:1;transform:none;pointer-events:auto}
.pill-btn{
  display:flex;align-items:center;gap:9px;
  padding:13px 32px;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#ffffff,#e7edf8);
  color:#12305c;font-weight:900;font-size:14px;letter-spacing:.04em;
  box-shadow:
    0 8px 20px -8px rgba(0,0,0,.65),
    inset 0 -2px 0 rgba(120,140,180,.3),
    inset 0 1px 0 #fff;
}
.pill-btn:active{transform:scale(.97)}
.pill-btn .par{font-size:13px}

/* ============ 白波纹转场 ============ */
.wipe{
  position:fixed;inset:0;z-index:96;pointer-events:none;
  background:#eef2f8;
  transform:translateY(135%);
  transition:transform .52s cubic-bezier(.65,0,.35,1);
}
.wipe::before{
  content:"";position:absolute;left:-6%;right:-6%;top:-30px;height:30px;
  background-image:radial-gradient(circle 15px at 15px 15px,#eef2f8 64%,transparent 66%);
  background-size:30px 30px;background-repeat:repeat-x;
}
.wipe.in{transform:translateY(0)}
.wipe.out{transform:translateY(-135%)}

/* ============ 收藏页 ============ */
.res-head{
  text-align:center;font-size:10px;font-weight:800;letter-spacing:.28em;
  color:var(--dim);margin-top:12px;
}
.res-sub{
  text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.03em;
  color:var(--dimmer);margin-top:8px;
}
.res-grid{
  display:flex;justify-content:center;align-items:center;
  margin-top:8px;flex:1 1 auto;min-height:0;
  --fan-w:min(150px,38vw);
}
/* 扇形：左卡左倾下沉、中卡居中放大置顶、右卡右倾下沉，相邻重叠 */
.res-grid .rg-item{
  position:relative;width:var(--fan-w);flex:0 0 auto;cursor:pointer;
  animation:gridIn .55s cubic-bezier(.2,.9,.3,1) both;
}
.res-grid .rg-item:nth-child(1){transform:rotate(-8deg) translateY(16px);z-index:1}
.res-grid .rg-item:nth-child(2){transform:translateY(0) scale(1.08);z-index:3;margin:0 -44px}
.res-grid .rg-item:nth-child(3){transform:rotate(8deg) translateY(16px);z-index:2}
.res-grid .rg-item .rg-wrap{transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.res-grid .rg-item:hover .rg-wrap{transform:translateY(-6px)}
.res-grid .rg-item:active .rg-wrap{transform:scale(.965)}
.res-grid .rg-item .rg-label{
  margin-top:7px;display:flex;align-items:baseline;justify-content:center;gap:6px;
}
.res-grid .rg-item .rg-p{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--dim)}
.res-grid .rg-item .rg-n{font-size:11px;font-weight:800;color:#fff;letter-spacing:-.01em}
@keyframes gridIn{from{opacity:0}to{opacity:1}}

/* 今日签文：去掉评级框，只留卡牌下方一句纯文案（落在黄色框位置） */
.res-line{
  flex:0 0 auto;
  text-align:center;
  margin:0 auto;
  padding:0 26px;
  font-size:clamp(12px,1.7vh,14.5px);
  font-weight:600;line-height:1.75;letter-spacing:.02em;
  color:rgba(216,231,255,.92);
  text-shadow:0 2px 14px rgba(0,12,32,.7);
}
/* 苏打饼干之神的眷顾：金色一句，只有拆到饼干才出现 */
.res-line.cracker-line:empty{display:none}
.res-line.cracker-line{
  color:#f0c96a;
  letter-spacing:.14em;
  text-shadow:0 2px 14px rgba(0,12,32,.7),0 0 18px rgba(240,201,106,.35);
}

/* ============ 苏打饼干彩蛋：升起的是一包饼干，不是卡牌 ============ */
.cracker-reveal .crk-box{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2vh;
}
.cracker-reveal .crk-img{
  width:104%;
  filter:drop-shadow(0 20px 30px rgba(0,8,24,.55));
  animation:crkFloat 3.4s ease-in-out infinite;
}
@keyframes crkFloat{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-9px) rotate(4deg)}
}
.cracker-reveal .crk-tag{
  font-family:"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:9.5px;letter-spacing:.24em;
  color:rgba(150,190,255,.7);
}
.cracker-reveal .crk-line{
  font-size:clamp(12px,1.8vh,15px);font-weight:700;
  color:#eef3fd;text-shadow:0 2px 12px rgba(0,12,32,.75);
}
.cracker-reveal .crk-skill{
  font-size:clamp(10px,1.5vh,13px);font-weight:600;
  letter-spacing:.16em;color:#f0c96a;
  text-shadow:0 0 14px rgba(240,201,106,.4);
}

/* 底部：只有一个分享按钮，居中；上边距把签文顶到卡牌下方 */
.res-actions{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:clamp(70px,13vh,120px);
  margin-bottom:clamp(6px,1.5vh,14px);
}
.btn-light{
  flex:0 0 auto;height:46px;padding:0 26px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#fff;color:#0a1526;border:0;border-radius:11px;
  font-family:var(--font);font-size:12.5px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 22px -10px rgba(0,0,0,.7),inset 0 -2px 0 rgba(10,30,60,.12);
  transition:transform .15s;
}
.btn-light:active{transform:scale(.97)}

/* ============ GUEST / 全屏 ============
   装饰性无用信息，且左下角 GUEST 会压住底部提示与按钮，统一隐藏。
   DOM 保留，避免 ensureGuest / 事件绑定报错。 */
.guest,.fs-btn{display:none !important}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(2,8,18,.76);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-mask.show{display:flex;animation:fadeIn .24s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;width:100%;max-width:360px;max-height:84vh;overflow-y:auto;
  background:linear-gradient(170deg,#0e2344,#061428);
  border:1px solid var(--stroke);border-radius:16px;
  padding:20px 18px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.9);
  animation:modalIn .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal.zoom-modal{
  max-width:330px;background:linear-gradient(170deg,#0c1f3c,#050f1f);
  display:flex;flex-direction:column;align-items:center;padding:22px 18px 18px;
}
.m-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:#fff;margin-bottom:14px}
.close-x{
  position:absolute;right:10px;top:8px;
  width:30px;height:30px;background:none;border:0;
  color:rgba(190,212,250,.6);font-size:22px;line-height:1;cursor:pointer;
}
.close-x:active{color:#fff}
#zoomBody{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.zoom-card{width:100%;max-width:250px}
.zoom-meta{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;
  color:var(--dim);text-align:center;
}

/* 卡池 · 收藏：历史已并入卡池，已获得的卡牌标金色 */
.pool-hint{font-size:10.5px;line-height:1.6;color:var(--dimmer);margin:-6px 0 13px}
.pool-hint b{color:#e8c877;font-weight:900}
.pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pool-item{
  position:relative;
  display:flex;align-items:center;gap:7px;
  padding:7px 9px;border-radius:8px;
  background:rgba(120,170,255,.06);border:1px solid rgba(120,170,255,.1);
}
.pool-item .pe{font-size:15px}
.pool-item .pn{font-size:10.5px;font-weight:700;color:rgba(215,230,255,.9);flex:1}
.pool-item .pr{font-size:8.5px;font-weight:900;letter-spacing:.04em;color:var(--dim)}
.pool-item.owned{
  background:linear-gradient(160deg,rgba(226,178,80,.18),rgba(120,90,30,.08));
  border-color:rgba(232,196,110,.55);
  box-shadow:0 0 0 1px rgba(232,196,110,.12) inset,0 0 14px -6px rgba(255,205,100,.5);
}
.pool-item.owned .pn{color:#f7dda0}
.pool-item.owned .pr{color:rgba(240,202,120,.85)}
.own-mark{
  position:absolute;top:2px;right:5px;
  font-size:9px;line-height:1;color:#ffd77a;
  text-shadow:0 0 8px rgba(255,200,90,.85);
}

/* ============ toast ============ */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);
  z-index:120;
  max-width:80vw;padding:10px 16px;border-radius:10px;
  background:rgba(245,248,255,.96);color:#0a1526;
  font-size:11.5px;font-weight:700;letter-spacing:.01em;
  opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.8);

.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 小屏适配（主体尺寸已由 vh/vw 自适应，这里只微调） ============ */
@media (max-width:380px){
  .app{padding-left:14px;padding-right:14px}
}
@media (max-height:700px){
  .big-title{margin-top:6px}
  .tap-hint{margin-top:8px}
  .res-actions{margin-top:clamp(52px,11vh,90px)}
}

/* @@HOLO-CSS-START@@ */
/* ============ 卡面箔光（HoloCard 移植层） ============ */
/* 箔光层叠在卡面上，圆角随卡走；screen 混合只加光、不改印刷色 */
.tcard{isolation:isolate}
.holo-foil{
  position:absolute;inset:0;z-index:5;border-radius:9px;
  width:100%;height:100%;display:block;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:0;transition:opacity .5s ease;
}
.holo-foil.on{opacity:1}
.holo-foil.dim{opacity:0}
/* 卡牌倾斜容器：箔光随卡面一起转，光源跟着指针走 */
.reveal .tiltbox{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  will-change:transform;
}
/* ============ 翻面：两面各自独立翻转，不靠背面剔除 ============ */
/* iOS Safari 在多层 preserve-3d 嵌套（perspective→tiltbox→flip→fc）下
   backface-visibility 会失效，翻转途中正反两面同时可见、且背面字是反的。
   改法：不再让容器转到背面，两个面各自在原地转半圈——
   正面 0°→180°、背面 180°→360°，过 90° 前各自缩成零宽，
   谁都照不到对方的背面，纯几何规避，跟浏览器实现无关。
   tiltbox 里的 3D 倾斜继续保留（箔光要随指针转），
   但它只负责倾斜，不参与正反面的遮挡判定。 */
.reveal .flip{
  transform-style:flat;
  transition:none;
}
.reveal .flip.flipped{transform:none}
.reveal .fc{
  transform-style:flat;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .78s cubic-bezier(.4,.05,.2,1);
  will-change:transform;
}
/* 两面的基准角度：静止时 front=0°、back=180°（背面那层在模板里本来就带 180°）。
   翻到背面时 front→180°、back→360°。
   要点：这里只让两个面各自原地转半圈，绝不能让 back 再叠一个 180°——
   两个 180 会互相抵消，卡片根本不会转到正面来，只看得到「反着印的背面」。 */
.reveal .fc.front{transform:rotateY(0deg)}
.reveal .fc.back{transform:rotateY(180deg)}
.reveal .flip.flipped .fc.front{transform:rotateY(180deg)}
.reveal .flip.flipped .fc.back{transform:rotateY(360deg)}
/* 翻到背面时卡牌放大（原来靠 .zoomed，这里只保证不叠加多余 3D） */
.reveal.zoomed .tiltbox{transform-style:flat}
/* 大图弹窗同样给透视，倾斜才有厚度 */
#zoomBody{perspective:900px}
.zoom-card{will-change:transform}
/* @@HOLO-CSS-END@@ */
</style>
</head>

  for (let i = 0; i < 3; i++) {
    const total = pool.reduce((s, c) => s + RARITY[c.rarity].weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (let j = 0; j < pool.length; j++) {
      r -= RARITY[pool[j].rarity].weight;
      if (r <= 0) { idx = j; break; }

    picked.push(pool.splice(idx, 1)[0]);

const CRACKER_CHANCE = 0.10;   // 每次开包日的触发概率（三包中随机一包是饼干）

function rollCrackerSlot() {
  return Math.random() < CRACKER_CHANCE ? Math.floor(Math.random() * 3) : -1;
}

// 加权抽一张，排除已有卡（给「多抽一包」用，保证不重复）
function drawExtra(excludeIds) {
  const pool = CARDS.filter(c => !excludeIds.has(c.id));
  const src = pool.length ? pool : CARDS;
  const total = src.reduce((s, c) => s + RARITY[c.rarity].weight, 0);
  let r = Math.random() * total, idx = 0;
  for (let j = 0; j < src.length; j++) {
    r -= RARITY[src[j].rarity].weight;
    if (r <= 0) { idx = j; break; }
  }
  return src[idx];
}

// 压在卡牌之上，视觉等同"箔反光盖在印刷上"，文字依旧是清晰的 DOM 文字。
// ============================================================
(function () {
  "use strict";

  const PRESETS = ["bursts", "stars", "shards", "cosmos", "rainbow", "swirl", "glitter", "gold"];
  const PERSPECTIVE = 1100;

  const VERT = `#version 300 es

uniform float uEdge;

out vec4 outColor;

const float TAU = 6.28318530718;

struct Foil {
  float mask;
  float angle;
  float jitter;

float hash(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

vec2 hash2(vec2 p) {

}

vec3 hue(float t) {
  t = abs(fract(t * 0.5) * 2.0 - 1.0);
  vec3 c = mix(vec3(0.1, 0.25, 1.0), vec3(0.0, 0.85, 1.0), smoothstep(0.0, 0.25, t));
  c = mix(c, vec3(0.25, 1.0, 0.2), smoothstep(0.25, 0.45, t));
  c = mix(c, vec3(1.0, 0.92, 0.05), smoothstep(0.45, 0.65, t));
  c = mix(c, vec3(1.0, 0.45, 0.05), smoothstep(0.65, 0.85, t));
  return mix(c, vec3(0.95, 0.12, 0.3), smoothstep(0.85, 1.0, t));

Foil bursts(vec2 p) {
  vec2 q = mat2(0.7071068, 0.7071068, -0.7071068, 0.7071068) * (p - vec2(0.5, 0.5 * uAspect)) / (0.283 / uScale);
  vec2 d = fract(q) - 0.5;
  float u = length(d) / 0.49;
  float angle = atan(d.y, d.x);
  if (u < 0.12) {
    float ring = min(floor(u / 0.045 + 0.5), 2.0);
    float count = max(1.0, ring * 6.0);
    float spot = (floor(angle / TAU * count) + 0.5) / count * TAU;
    vec2 dot = vec2(cos(spot), sin(spot)) * ring * 0.045;
    float m = smoothstep(0.024, 0.012, length(d / 0.49 - dot));

  bool inner = u < 0.66;
  float slot = angle / TAU * (inner ? 56.0 : 72.0);
  bool shifted = mod(floor(slot), 2.0) > 0.5;
  vec2 band = inner ? (shifted ? vec2(0.45, 0.61) : vec2(0.33, 0.49)) : (shifted ? vec2(0.84, 0.99) : vec2(0.7, 0.85));
  float across = abs(u - (band.x + band.y) * 0.5) / ((band.y - band.x) * 0.5);
  float along = abs(fract(slot) - 0.5) * 2.0;

Foil stars(vec2 p) {
  Foil best = Foil(0.0, 0.0, 0.0, vec2(0.0));
  vec2 g = p / (0.08 / uScale);
  vec2 base = floor(g);
  for (int j = -1; j <= 1; j++) {

      float pick = hash(id + 1.3);
      vec2 d = g - (id + 0.5 + (hash2(id) - 0.5) * 0.55);
      float m = smoothstep(0.07, 0.035, length(d));

      float r = length(d);
      float m = max(smoothstep(0.05, 0.0, abs(r - size)), smoothstep(size, size - 0.04, r) * 0.22);

  vec2 cell = floor(fine);

  float spin = hash(cell + 3.0) * TAU;
  d = mat2(cos(spin), -sin(spin), sin(spin), cos(spin)) * d;
  vec2 a = abs(d);

  float piece = smoothstep(size, size - 0.07, hexagon) * step(0.42, hash(cell + 4.0));

  vec2 speckCell = floor(fine);
  float speck = smoothstep(0.24, 0.0, length(fract(fine) - 0.5 - (hash2(speckCell) - 0.5) * 0.5)) * step(0.72, hash(speckCell + 1.0));
  float speckFlash = pow(max(dot(normalize(vec3((hash2(speckCell + 2.0) - 0.5) * 0.9, 1.0)), halfway), 0.0), 10.0);

  else if (uPreset == 5) f = swirl(p);
  else if (uPreset == 6) f = glitter(p);
  else f = gold(p);

  vec3 metal = uPreset == 7 ? vec3(1.0, 0.74, 0.38) * dot(uFoil, vec3(0.3333)) * 1.15 : uFoil;
  vec4 look = uPreset == 0 ? vec4(0.25, 1.9, 0.12, 1.0)
    : uPreset == 1 ? vec4(0.6, 1.4, 0.3, 1.0)
    : uPreset == 2 ? vec4(0.9, 0.9, 0.6, 0.5)
    : uPreset == 3 ? vec4(0.7, 1.2, 0.35, 0.85)
    : uPreset == 4 ? vec4(0.0, 2.2, 0.0, 0.45)
    : uPreset == 5 ? vec4(1.6, 0.3, 0.0, 0.4)
    : uPreset == 6 ? vec4(0.9, 1.0, 0.6, 1.0)
    : vec4(0.3, 1.0, 0.2, 0.95);
  vec2 dir = vec2(cos(f.angle), sin(f.angle));
  float phase = dot(sweep, dir) * look.x + dot(sweep, vec2(0.8, 0.6)) * look.y + f.jitter * look.z;
  float spoke = 1.0;
  if (uPreset == 5) {
    float facing = dot(normalize(sweep + 0.0001), dir);
    phase = f.jitter * 2.4 + facing * 0.6 + length(sweep) * 0.8;
    spoke = 0.3 + 0.7 * smoothstep(0.25, 0.95, abs(facing));
  }
  vec3 tint = hue(phase);
  // 暖金箔：彩虹只留一点点，主体是金属本色，避免蚀刻金变成绿紫
  if (uPreset == 7) tint = mix(tint, metal, 0.92);
  float glint = pow(max(dot(normalize(vec3(f.facet, 1.0)), halfway), 0.0), 24.0) * step(0.001, length(f.facet));
  bool layered = uPreset == 2 || uPreset == 4 || uPreset == 5 || uPreset == 7;
  vec3 foil = (layered ? tint : mix(tint, vec3(1.0), 0.12)) * (1.15 + 0.3 * sheen) + metal * glint * 1.2;
  float tilted = smoothstep(0.02, 0.21, length(sin(uTilt)));
  float awake = mix(0.2, 1.0, tilted);
  float strength = uIntensity * f.mask * (1.0 - frame) * awake;
  float band = uPreset == 5 ? spoke : layered ? 0.25 + 0.75 * smoothstep(0.3, 0.95, 0.5 + 0.5 * cos(phase * TAU * 0.5 + 1.3)) : 1.0;
  // 与金属混合的箔层（原版按"印刷 × 箔"合成，这里输出箔本身，交给 screen 叠加）
  vec3 color = foil * look.w * band * clamp(strength, 0.0, 1.0);
  color += sparkles(p, halfway, sweep, mix(0.55, 1.0, tilted)) * uEdge * frame;
  color += uFoil * sheen * 0.12 * frame;
  color += vec3(sheen * 0.07 + shine * 0.3) * uGlare;
  outColor = vec4(color * alpha, alpha);
}
`;

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  function parseColor(value) {
    const fallback = [0.78, 0.8, 0.84];
    if (typeof document === "undefined") return fallback;
    const ctx = document.createElement("canvas").getContext("2d");
    if (!ctx) return fallback;
    ctx.fillStyle = "#000000";
    ctx.fillStyle = value;
    const resolved = ctx.fillStyle;
    if (typeof resolved !== "string" || !resolved.startsWith("#") || resolved.length !== 7) return fallback;
    return [1, 3, 5].map(i => Math.pow(parseInt(resolved.slice(i, i + 2), 16) / 255, 2.2));
  }

  function compile(gl, type, source) {
    const shader = gl.createShader(type);
    if (!shader) return null;
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    gl.deleteShader(shader);
    return null;
  }

  /**
   * 把箔光层挂到一张卡面上。
   * @param {HTMLElement} cardEl  .tcard 元素
   * @param {Object} options
   *  preset / intensity / scale / edgeSparkle / frame(百分比) / glare /
   *  foilColor / tiltMax / hoverScale / radius / idle
   *  tiltEl    要做 3D 倾斜的元素（一般是 .tiltbox）
   *  trackEl   监听指针的元素（默认 cardEl）
   *  flipEl    翻转容器，翻到背面时箔光自动收敛
   */
  function attach(cardEl, options) {
    if (!cardEl || !cardEl.parentNode) return null;
    const opts = options || {};

    const canvas = document.createElement("canvas");
    canvas.className = "holo-foil";
    const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) return null;

    const settings = {
      preset: Math.max(0, PRESETS.indexOf(opts.preset || "bursts")),
      intensity: clamp(opts.intensity == null ? 0.42 : opts.intensity, 0, 1),
      scale: clamp(opts.scale == null ? 1 : opts.scale, 0.25, 4),
      edgeSparkle: clamp(opts.edgeSparkle == null ? 0.4 : opts.edgeSparkle, 0, 1),
      frame: clamp(opts.frame == null ? 3.2 : opts.frame, 0, 20) / 100,
      glare: clamp(opts.glare == null ? 0.45 : opts.glare, 0, 1),
      foil: parseColor(opts.foilColor || "#e2e6ec"),
      radius: Math.max(0, opts.radius == null ? 9 : opts.radius),
      tiltMax: clamp(opts.tiltMax == null ? 10 : opts.tiltMax, 0, 45),
      hoverScale: clamp(opts.hoverScale == null ? 1.03 : opts.hoverScale, 0.8, 1.3),
      idle: opts.idle !== false
    };

    const vertex = compile(gl, gl.VERTEX_SHADER, VERT);
    const fragment = compile(gl, gl.FRAGMENT_SHADER, FRAG);
    if (!vertex || !fragment) return null;
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.bindAttribLocation(program, 0, "position");
    gl.linkProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      gl.deleteProgram(program);
      return null;
    }
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {};
    [
      "uSize", "uAspect", "uTilt", "uLight", "uDistance", "uPreset", "uIntensity",
      "uScale", "uEdge", "uFrame", "uRadius", "uGlare", "uFoil"
    ].forEach(name => { uniforms[name] = gl.getUniformLocation(program, name); });

    // 有了真正的箔光层，就撤掉旧的 CSS 渐变箔，避免两层叠色
    const legacy = cardEl.querySelector(".holo");
    if (legacy) legacy.remove();
    cardEl.appendChild(canvas);

    const tiltEl = opts.tiltEl || null;
    const trackEl = opts.trackEl || cardEl;
    const flipEl = opts.flipEl || null;
    const pointer = { x: 0.5, y: 0.5, inside: false };
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const st = {
      tiltX: 0, tiltY: 0, tiltVX: 0, tiltVY: 0,
      lightX: 0.36, lightY: 0.26, lightVX: 0, lightVY: 0,
      lift: 1, liftV: 0, turn: 0, clock: Math.random() * 40
    };
    let raf = 0;
    let last = 0;
    let alive = true;
    let visible = true;
    let calm = 0;

    const draw = () => {
      const w = canvas.width;
      const h = canvas.height;
      if (!w || !h) return;
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(program);
      gl.uniform2f(uniforms.uSize, w, h);
      gl.uniform1f(uniforms.uAspect, h / w);
      gl.uniform2f(uniforms.uTilt, (st.tiltX * Math.PI) / 180, (st.tiltY * Math.PI) / 180);
      gl.uniform2f(uniforms.uLight, st.lightX, st.lightY);
      gl.uniform1f(uniforms.uDistance, PERSPECTIVE / Math.max(1, canvas.clientWidth));
      gl.uniform1i(uniforms.uPreset, settings.preset);
      gl.uniform1f(uniforms.uIntensity, settings.intensity);
      gl.uniform1f(uniforms.uScale, settings.scale);
      gl.uniform1f(uniforms.uEdge, settings.edgeSparkle);
      gl.uniform1f(uniforms.uFrame, settings.frame);
      gl.uniform1f(uniforms.uRadius, settings.radius / Math.max(1, canvas.clientWidth));
      gl.uniform1f(uniforms.uGlare, settings.glare);
      gl.uniform3f(uniforms.uFoil, settings.foil[0], settings.foil[1], settings.foil[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    const spring = (value, velocity, target, stiffness, damping, dt) => {
      const next = velocity + ((target - value) * stiffness - velocity * damping) * dt;
      return [value + next * dt, next];
    };

    const flipped = () => !!(flipEl && flipEl.classList.contains("flipped"));

    const tick = now => {
      raf = 0;
      if (!alive) return;
      if (!canvas.isConnected) return;
      const dt = Math.min(1 / 30, Math.max(1 / 240, (now - last) / 1000));
      last = now;
      let targetX = 0;
      let targetY = 0;
      let lightX = 0.36;
      let lightY = 0.26;
      let lift = 1;
      const back = flipped();
      const drifting = settings.idle && !reduce && !pointer.inside;
      if (pointer.inside && !reduce && !back) {
        targetX = (0.5 - pointer.y) * 2 * settings.tiltMax;
        targetY = (pointer.x - 0.5) * 2 * settings.tiltMax;
        lightX = pointer.x;
        lightY = pointer.y;
        lift = settings.hoverScale;
      } else if (drifting && !back) {
        st.clock += dt;
        const t = st.clock;
        targetX = Math.sin(t * 0.7) * settings.tiltMax * 0.28;
        targetY = Math.sin(t * 0.53 + 1.2) * settings.tiltMax * 0.4;
        lightX = 0.5 + Math.sin(t * 0.41) * 0.42;
        lightY = 0.38 + Math.sin(t * 0.33 + 0.6) * 0.3;
      }
      const steps = Math.ceil(dt / (1 / 240));
      const h = dt / steps;
      for (let i = 0; i < steps; i++) {
        [st.tiltX, st.tiltVX] = spring(st.tiltX, st.tiltVX, targetX, 150, 16, h);
        [st.tiltY, st.tiltVY] = spring(st.tiltY, st.tiltVY, targetY, 150, 16, h);
        [st.lightX, st.lightVX] = spring(st.lightX, st.lightVX, lightX, 220, 30, h);
        [st.lightY, st.lightVY] = spring(st.lightY, st.lightVY, lightY, 220, 30, h);
        [st.lift, st.liftV] = spring(st.lift, st.liftV, lift, 320, 30, h);
      }
      if (tiltEl) {
        tiltEl.style.transform =
          "scale(" + st.lift.toFixed(4) + ") rotateX(" + st.tiltX.toFixed(3) + "deg) rotateY(" + st.tiltY.toFixed(3) + "deg)";
      }
      draw();
      const motion =
        Math.abs(st.tiltVX) + Math.abs(st.tiltVY) + Math.abs(st.liftV) * 40 +
        (Math.abs(st.lightVX) + Math.abs(st.lightVY)) * 60 +
        Math.abs(st.tiltX - targetX) + Math.abs(st.tiltY - targetY);
      calm = motion > 0.02 ? 0 : calm + dt;
      if (!visible || (!drifting && !pointer.inside && calm > 0.3)) return;
      raf = requestAnimationFrame(tick);
    };

    const wake = () => {
      if (raf || !alive) return;
      calm = 0;
      last = performance.now();
      raf = requestAnimationFrame(tick);
    };

    const resize = () => {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(canvas.clientWidth * ratio));
      const h = Math.max(1, Math.round(canvas.clientHeight * ratio));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      draw();
      wake();
    };

    const track = e => {
      if (e.pointerType === "touch" && e.type === "pointermove" && !e.buttons) return;
      const rect = trackEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      pointer.x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      pointer.y = clamp((e.clientY - rect.top) / rect.height, 0, 1);
      pointer.inside = true;
      wake();
    };
    const leave = () => {
      pointer.inside = false;
      wake();
    };

    trackEl.addEventListener("pointerenter", track);
    trackEl.addEventListener("pointermove", track);
    trackEl.addEventListener("pointerdown", track);
    trackEl.addEventListener("pointerleave", leave);
    trackEl.addEventListener("pointercancel", leave);

    const ro = new ResizeObserver(resize);
    ro.observe(canvas);
    const io = new IntersectionObserver(entries => {
      visible = entries.some(entry => entry.isIntersecting);
      if (visible) wake();
    });
    io.observe(cardEl);

    // 翻到背面看签文时让箔光收起来，回到卡面再亮
    let mo = null;
    if (flipEl) {
      mo = new MutationObserver(() => { canvas.classList.toggle("dim", flipped()); wake(); });
      mo.observe(flipEl, { attributes: true, attributeFilter: ["class"] });
    }

    canvas.classList.add("on");
    resize();

    return {
      destroy() {
        alive = false;
        cancelAnimationFrame(raf);
        trackEl.removeEventListener("pointerenter", track);
        trackEl.removeEventListener("pointermove", track);
        trackEl.removeEventListener("pointerdown", track);
        trackEl.removeEventListener("pointerleave", leave);
        trackEl.removeEventListener("pointercancel", leave);
        ro.disconnect();
        io.disconnect();
        if (mo) mo.disconnect();
        if (tiltEl) tiltEl.style.transform = "";
        gl.deleteBuffer(buffer);
        gl.deleteProgram(program);
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
    };
  }

  window.WhiteBoxHolo = { attach: attach, presets: PRESETS.slice() };
})();
/* @@HOLO-JS-END@@ */
</script>
<script>
// ============================================================
// WhiteBox
// 规则：一天只能抽一次，一次三张卡；三张卡不再区分时段，只按 01/02/03 编号
// 流程：首页点任一卡包 → 横向撕封条 → 卡牌正面直接升起 → 点击放大翻转看详解
//       → 抽下一张卡 → 三张集齐自动进今日运势
// ============================================================
const LS = { date: "dftcg_date", cards: "dftcg_cards", hist: "dftcg_hist", guest: "dftcg_guest", cracker: "dftcg_cracker" };
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const state = {
  cur: 0,
  packs: [
    { label: "01", opened: false, card: null },
    { label: "02", opened: false, card: null },
    { label: "03", opened: false, card: null },
  ],
  pending: [],
  crackerSlot: -1,     // 今天哪一包是苏打饼干（-1 = 无）
  crackerFound: false, // 今天的饼干是否已被拆出（每天最多一次）
  activePack: 0,
  busy: false,
  revealed: false,
};

// ---------- 工具 ----------
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDateCN(s) {
  const [y, m, d] = s.split("-");
  return y + " 年 " + Number(m) + " 月 " + Number(d) + " 日";
}
function hasToday() {
  return localStorage.getItem(LS.date) === todayStr() && !!localStorage.getItem(LS.cards);
}
function showScreen(id) {
  $$(".screen").forEach(s => s.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
  // 结果页左下角有操作按钮，隐藏 GUEST 徽章避免遮挡
  document.body.classList.toggle("at-result", id === "resultScreen");
  window.scrollTo(0, 0);
}

// ---------- 卡牌 DOM ----------
function cardHTML(card, label) {
  const r = RARITY[card.rarity];
  const holo = (card.rarity === "SR" || card.rarity === "SSR") ? '<div class="holo"></div>' : "";
  return `
    <div class="tcard" data-rarity="${card.rarity}">
      <div class="tc-frame">
        <div class="tc-head">
          <span class="tc-name">${card.name}</span>
          <span class="tc-attr">${r.label === "N" ? "运" : r.label}</span>
        </div>
        <div class="tc-type">[运势卡 · ${label}]</div>
        <div class="tc-art">
          <span class="tca-emoji">${card.emoji}</span>
          <span class="tca-sign">FX</span>
        </div>
        <div class="tc-text">
          <p class="tct-desc">${card.desc}</p>
          <p class="tct-advice">${card.advice}</p>
        </div>
        <div class="tc-foot">© 2026 WhiteBox · ${card.skill}</div>
      </div>
      ${holo}
    </div>`;
}

// 卡牌背面：点击翻转后看到的「详解签文」
function cardDetailHTML(card, label) {
  const r = RARITY[card.rarity];
  return `
    <div class="detail-card" data-rarity="${card.rarity}">
      <div class="dc-inner">
        <div class="dc-top">
          <span class="dc-tag">WhiteBox · ${label} / 03</span>
          <span class="dc-rarity">${r.label}</span>
        </div>
        <div class="dc-emoji">${card.emoji}</div>
        <div class="dc-name">${card.name}</div>
        <div class="dc-meta">${card.type} · 招式「${card.skill}」</div>
        <div class="dc-rule"></div>
        <div class="dc-desc">${card.desc}</div>
        <div class="dc-advice"><span>今 日 答 案</span>${card.advice}</div>
        <div class="dc-foot">© 2026 WhiteBox · 第 ${card.score} 签</div>
      </div>
    </div>`;
}

function cardBackHTML() {
  return `
    <div class="card-back">
      <div class="cbframe"></div>
      <div class="cbring">
        <svg viewBox="0 0 108 108" aria-hidden="true">
          <circle cx="54" cy="54" r="51" fill="none" stroke="rgba(130,180,255,.42)" stroke-width="1.2"/>
          <circle cx="54" cy="54" r="45" fill="none" stroke="rgba(130,180,255,.2)" stroke-width="1"/>
          <circle cx="54" cy="54" r="36" fill="none" stroke="rgba(130,180,255,.12)" stroke-width="1"/>
        </svg>
        <div class="cbl"><span class="l2">WhiteBox</span></div>
      </div>
    </div>`;
}

// ---------- 卡包 ----------
function packHTML(p) {
  return `
    <div class="pack" data-i="0">
      <div class="pk-edge top"></div>
      <div class="pk-edge bot"></div>
      <div class="pk-tear"></div>
      <div class="pk-series">WhiteBox</div>
      <div class="pk-logo"><span class="pl-main">WhiteBox</span></div>
      <div class="pk-count">3 COLLECTIBLE CARDS</div>
      <div class="pk-chip"><span class="pcc"></span><span class="pct">${p.opened ? "OPENED" : "SEALED"}</span></div>
    </div>`;
}

function renderCarousel() {
  const stage = $("#packStage");
  stage.innerHTML = state.packs.map(packHTML).join("");
  $$("#packStage .pack").forEach((el, i) => { el.dataset.i = i; });
  updatePositions();
}

function updatePositions() {
  const n = state.packs.length;
  $$("#packStage .pack").forEach((el, i) => {
    let d = i - state.cur;
    if (d > n / 2) d -= n;
    if (d < -n / 2) d += n;
    const pos = d === 0 ? 0 : (d > 0 ? 1 : -1);
    el.dataset.pos = pos;
    if (Math.abs(d) > 1) {
      el.style.opacity = "0";
      el.style.pointerEvents = "none";
    } else {
      el.style.opacity = "";
      el.style.pointerEvents = "";
    }
    if (d === 0) el.style.zIndex = "5";
    else el.style.zIndex = "";
  });
}

// ---------- 卡包手势：左右滑动选包 / 轻点开启 ----------
function bindSwipe() {
  const stage = $("#packStage");
  if (!stage) return;
  let sx = 0, sy = 0, st = 0, startIdx = 0, moved = false, active = false, pid = null;

  const clear = () => {
    stage.classList.remove("dragging");
    stage.style.removeProperty("--drag");
    active = false; moved = false; pid = null;
  };

  stage.addEventListener("pointerdown", e => {
    if (state.busy) return;
    const pack = e.target.closest && e.target.closest(".pack");
    if (!pack) return;
    active = true; moved = false;
    sx = e.clientX; sy = e.clientY; st = Date.now();
    startIdx = Number(pack.dataset.i);
    pid = e.pointerId;
    stage.classList.add("dragging");
    try { stage.setPointerCapture(pid); } catch (_) {}
    e.preventDefault();
  });

  stage.addEventListener("pointermove", e => {
    if (!active) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      // 纵向为主 → 放弃手势，避免和下拉冲突
      if (Math.abs(dy) > Math.abs(dx)) { clear(); return; }
      moved = true;
    }
    if (!moved) return;
    // 阻尼：越拉越沉，卡包跟手
    const damped = Math.sign(dx) * Math.min(Math.abs(dx) * 0.82, stage.clientWidth * 0.42);
    stage.style.setProperty("--drag", damped.toFixed(1) + "px");
    e.preventDefault();
  });

  const finish = e => {
    if (!active) return;
    const dx = e.clientX - sx;
    const n = state.packs.length;
    const threshold = Math.max(44, Math.min(72, stage.clientWidth * 0.16));
    try { stage.releasePointerCapture(pid); } catch (_) {}

    // 先恢复过渡，同帧把位移归零 / 切换布局，让 CSS 做切包动画
    stage.classList.remove("dragging");
    stage.style.removeProperty("--drag");

    if (moved && Math.abs(dx) >= threshold) {
      const dir = dx < 0 ? 1 : -1;   // 左滑看下一包
      state.cur = (state.cur + dir + n) % n;
      updatePositions();
    } else if (!moved && Math.abs(dx) < 8 && Date.now() - st < 700) {
      // 轻点：开启点中的那一包
      state.cur = startIdx;
      updatePositions();
      goDraw(startIdx);
    } else {
      updatePositions();   // 未过阈值 → 回弹
    }
    active = false; moved = false; pid = null;
  };
  stage.addEventListener("pointerup", finish);
  stage.addEventListener("pointercancel", finish);
}

// ---------- 首页 ----------
function renderHome() {
  renderCarousel();
}

// ---------- 倒计时（仅今日已抽完时显示） ----------
function startCountdown() {
  const box = $("#countdown");
  const tick = () => {
    if (!hasToday()) { box.classList.remove("show"); return; }
    box.classList.add("show");
    const now = new Date();
    const next = new Date(now);
    next.setHours(24, 0, 0, 0);
    const diff = Math.floor((next - now) / 1000);
    const h = String(Math.floor(diff / 3600)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
    const s = String(diff % 60).padStart(2, "0");
    box.textContent = `${h}:${m}:${s} 后可再次抽卡`;
  };
  tick();
  setInterval(tick, 1000);
}

// ---------- 游客 ID ----------
function ensureGuest() {
  let g = localStorage.getItem(LS.guest);
  if (!g) {
    g = Array.from({ length: 6 }, () => "0123456789ABCDEF"[Math.floor(Math.random() * 16)]).join("");
    localStorage.setItem(LS.guest, g);
  }
  $("#guestId").textContent = "GUEST " + g;
}

// ---------- 进入开卡页 ----------
function goDraw(idx) {
  // 一天一次：今天已抽完就不再进开卡页
  if (hasToday()) { renderResult(); return; }
  clearAutoFinish();
  if (revealHolo) { revealHolo.destroy(); revealHolo = null; }
  state.activePack = idx;
  state.revealed = false;
  state.busy = false;
  const p = state.packs[idx];
  $("#drawSeries").textContent = "WhiteBox · CARD " + p.label + " / " + String(state.packs.length).padStart(2, "0");
  renderBars();
  $("#stage").innerHTML = `
    <div class="raw-pack" id="rawPack">
      <canvas class="rp-cv" id="packCv"></canvas>
      <div class="rp-tear" id="rpTear"></div>
    </div>`;
  $("#flipHint").innerHTML = '按住卡包 · 横向撕开';
  updateNextBtn();
  showScreen("drawScreen");
  bindTear();
}

function renderBars() {
  $("#bars").innerHTML = state.packs.map((p, i) =>
    `<i class="${p.opened || (i === state.activePack && state.revealed) ? "on" : ""}"></i>`).join("");
}

// ---------- 白波纹转场 ----------
function wipeIn(cb) {
  const w = $("#wipe");
  w.classList.remove("out");
  w.classList.add("in");
  setTimeout(cb, 540);
}
function wipeOut() {
  const w = $("#wipe");
  w.classList.remove("in");
  w.classList.add("out");
  setTimeout(() => { w.classList.remove("out"); }, 600);
}

const tearFx = { p: 0, fly: -1 };
const BAND_RATIO = 0.12;  // 撕掉的带高（占包高比例，对齐参考视频量得的 ~12%）
const TOOTH_RATIO = 0.032; // 锯齿撕痕振幅（占包高比例）
const TOOTH_N = 14;       // 全宽锯齿数（参考视频约 14~16 齿）
const LIFT_MAX = 20;      // 拖动阶段掀起的最大角度（度），轴心在撕口锯齿上，贴面不脱节

// 锯齿撕痕线：x 处的 y（pack 局部坐标）。三角波，在 bandH-a 与 bandH+a 之间
function zigY(x, w, h) {
  const half = w / TOOTH_N / 2, a = TOOTH_RATIO * h;
  const ph = (x / (half * 2)) % 1;
  const tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
  return BAND_RATIO * h - a + 2 * a * tri;
}
// 锯齿线折线顶点（含端点，顶点落在波峰/波谷上，折线即精确锯齿）
function zigPts(x0, x1, w, h) {
  const half = w / TOOTH_N / 2;
  const pts = [[x0, zigY(x0, w, h)]];
  for (let k = Math.ceil(x0 / half); k * half <= x1; k++) {
    const x = k * half;
    if (x > x0 + 0.01 && x < x1 - 0.01) pts.push([x, zigY(x, w, h)]);
  }
  pts.push([x1, zigY(x1, w, h)]);
  return pts;
}

function smoothstep(x) {
  x = Math.max(0, Math.min(1, x));
  return x * x * (3 - 2 * x);
}

function drawTear() {
  const raw = $("#rawPack"), cv = $("#packCv");
  if (!raw || !cv || !PACK_IMG.complete || !PACK_IMG.naturalWidth) return;
  const w = raw.clientWidth, h = raw.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) {
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  const p = Math.max(0, Math.min(1, tearFx.p));
  const fly = tearFx.fly;
  if (p <= 0 && fly < 0) return;

  // 画布原点相对包体的偏移（画布比包大一圈，给掀起/飞走留空中余量）
  const OX = 0.30 * w, OY = 0.60 * h;
  const IW = PACK_IMG.naturalWidth, IH = PACK_IMG.naturalHeight;
  const t = Math.min(w, p * w);   // 撕口位置（包内横向坐标）

  // 全部绘制在「pack 局部坐标系」里：原点 = 包左上角
  ctx.save();
  ctx.translate(OX, OY);

  // 已撕区域（撕口左侧）：袋面沿锯齿撕痕线裁开，露出真实撕痕——像素全部来自 pack.png
  if (t > 0.5) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, zigY(0, w, h));
    zigPts(0, t, w, h).forEach(pt => ctx.lineTo(pt[0], pt[1]));
    ctx.lineTo(t, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.clip();
    ctx.drawImage(PACK_IMG, 0, 0, IW, IH, 0, 0, w, h);
    ctx.restore();
  }

  // 未撕区域（撕口右侧）：原样整包
  if (t < w - 0.5) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(t, 0, w - t, h);
    ctx.clip();
    ctx.drawImage(PACK_IMG, 0, 0, IW, IH, 0, 0, w, h);
    ctx.restore();
  }

  // 封条（撕口左段）：下缘带锯齿撕痕（与包面共用同一条锯齿边界，严丝合缝），
  // 绕撕口处的锯齿点整条掀起——贴着包面转，不会脱节漏背景
  if (t > 0.5) {
    ctx.save();
    if (fly >= 0) {
      // 抛飞：从撕到底的姿态无缝脱离——上飘、摆正、淡出，与参考视频 f_011→f_014 同构
      const rise = fly * fly * h * 0.42, drift = fly * w * 0.10;
      const th = (LIFT_MAX * (1 - fly) + 4 * fly) * Math.PI / 180;
      ctx.translate(w + drift, zigY(w, w, h) - rise);
      ctx.rotate(th);
      ctx.globalAlpha = 1 - smoothstep((fly - 0.35) / 0.65);
      // 封条区域（pack 局部）：顶边 → 撕口竖边 → 锯齿底边 → 左缘闭合
      const pw = zigY(w, w, h);
      ctx.beginPath();
      ctx.moveTo(-w, -pw);
      ctx.lineTo(0, -pw);
      ctx.lineTo(0, 0);
      const fp = zigPts(0, w, w, h);
      for (let i = fp.length - 1; i >= 0; i--) ctx.lineTo(fp[i][0] - w, fp[i][1] - pw);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(PACK_IMG, 0, 0, IW, IH, -w, -pw, w, h);
    } else {
      const pvy = zigY(t, w, h);
      ctx.translate(t, pvy);
      ctx.rotate(LIFT_MAX * p * Math.PI / 180);
      ctx.beginPath();
      ctx.moveTo(-t, -pvy);
      ctx.lineTo(0, -pvy);
      ctx.lineTo(0, 0);
      const sp = zigPts(0, t, w, h);
      for (let i = sp.length - 1; i >= 0; i--) ctx.lineTo(sp[i][0] - t, sp[i][1] - pvy);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(PACK_IMG, 0, 0, IW, IH, -t, -pvy, w, h);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function bindTear() {
  const tear = $("#rpTear");
  if (!tear) return;
  let startX = 0, dragging = false, lastP = 0;

  const resetTear = () => {
    tearFx.p = 0; tearFx.fly = -1;
    const raw = $("#rawPack"), cv = $("#packCv");
    if (raw) raw.classList.remove("tearing");
    if (cv) cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  };

  resetTear();

  tear.addEventListener("pointerdown", e => {
    if (state.busy || state.revealed) return;
    dragging = true;
    lastP = 0;
    startX = e.clientX;
    tear.setPointerCapture(e.pointerId);
    tear.classList.add("drag");
    e.preventDefault();
  });

  tear.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = Math.max(0, e.clientX - startX);
    lastP = Math.min(1, dx / TEAR_DIST);
    tearFx.p = lastP;
    if (lastP > 0) $("#rawPack").classList.add("tearing");
    drawTear();               // 同步直绘：pointermove 本身已被浏览器合帧到每帧一次，不依赖 rAF
    if (lastP >= 1) { dragging = false; fireTear(); }
  });

  const release = () => {
    if (!dragging) return;
    dragging = false;
    tear.classList.remove("drag");
    if (lastP < 0.05 || state.busy) { resetTear(); return; }   // 轻点一下：直接归位
    const from = tearFx.p, t0 = performance.now(), DUR = 300;
    const step = () => {
      let u = Math.min(1, (performance.now() - t0) / DUR);
      u = 1 - (1 - u) * (1 - u);                               // easeOut 顺滑回弹
      tearFx.p = from * (1 - u);
      drawTear();
      if (u < 1) setTimeout(step, 16);
      else resetTear();
    };
    setTimeout(step, 16);
  };
  tear.addEventListener("pointerup", release);
  tear.addEventListener("pointercancel", release);
}

function fireTear() {
  if (state.busy) return;
  state.busy = true;
  $("#flipHint").innerHTML = "封条已撕开";

  // 手指此刻已在 p=1，封条从掀起姿态无缝脱离袋面：上飘、摆正、淡出，
  // 全程逐帧直绘，与拖动阶段连成一气
  tearFx.p = 1;
  const t0 = performance.now(), DUR = 640;
  const step = () => {
    const u = Math.min(1, (performance.now() - t0) / DUR);
    tearFx.fly = u;
    drawTear();
    if (u < 1) setTimeout(step, 16);
  };
  setTimeout(step, 16);

  // 卡牌在封条抛起的过程中从袋口升起，两段动作交叠，节奏更顺
  setTimeout(() => openPack(true), 380);
}

// ---------- 出卡后的下一步 ----------
function updateNextBtn() {
  const box = $("#nextCta");
  if (!box) return;
  if (!state.revealed) { box.classList.remove("show"); return; }
  const allDone = state.packs.every(p => p.opened);
  $("#nextText").textContent = allDone ? "查看今日运势" : "抽下一张卡";
  box.classList.add("show");
}

// ---------- 第三张抽完自动进入今日运势 ----------
let autoFinishTimer = null;
function scheduleAutoFinish(ms) {
  clearAutoFinish();
  autoFinishTimer = setTimeout(() => {
    autoFinishTimer = null;
    if (!state.revealed) return;
    // 用户正停在背面详解时不打断
    const f = $("#flip");
    if (f && f.classList.contains("flipped")) return;
    finishDraw();
  }, ms);
}
function clearAutoFinish() {
  if (autoFinishTimer) { clearTimeout(autoFinishTimer); autoFinishTimer = null; }
}

// ---------- 点击卡牌：放大 + 3D 翻转看详解 ----------
function bindCardFlip(isLast) {
  const rv = $("#reveal"), flip = $("#flip");
  if (!rv || !flip) return;
  rv.classList.add("flippable");
  rv.addEventListener("click", () => {
    const toBack = !flip.classList.contains("flipped");
    flip.classList.toggle("flipped", toBack);
    rv.classList.toggle("zoomed", toBack);
    if (toBack) {
      // 主动查看 → 暂缓自动进入，让用户把这张看完
      clearAutoFinish();
      $("#flipHint").innerHTML = "再点一次 · 翻回卡面";
    } else {
      $("#flipHint").innerHTML = isLast
        ? "全部集齐 · 即将揭晓今日运势"
        : "点击卡牌 · 翻转看详解";
      if (isLast) scheduleAutoFinish(2600);
    }
  });
}

// ---------- 开封：卡牌正面直接从包里升起（拆到苏打饼干则是饼干升起） ----------
function openPack(force) {
  if (state.busy && !force) return;
  state.busy = true;

  const pack = state.packs[state.activePack];
  const crackerHit = !state.crackerFound && state.activePack === state.crackerSlot;

  if (crackerHit) {
    // 苏打饼干之神眷顾：这包不是卡牌，是一包苏打饼干
    pack.cracker = true;
    pack.card = null;
    pack.opened = true;
    state.crackerFound = true;
    state.crackerSlot = -1;
    localStorage.setItem(LS.cracker, "1");
    // 技能「多抽一包」：当天追加一包，这一包必定是卡牌（不与已有卡重复）
    const exclude = new Set();
    state.pending.filter(Boolean).forEach(c => exclude.add(c.id));
    state.packs.forEach(p => { if (p.card) exclude.add(p.card.id); });
    state.packs.push({ label: String(state.packs.length + 1).padStart(2, "0"), opened: false, card: null });
    state.pending[state.packs.length - 1] = drawExtra(exclude);
    toast("技能发动 · 多抽一包");
    renderRevealCracker(pack.label);
  } else {
    const card = state.pending[state.activePack] || drawThree()[0];
    pack.card = card;
    pack.opened = true;
    renderReveal(card, pack.label);
  }
  state.revealed = true;

  // 卡包柔和退场：等封条翻转飞走后再淡出，避免父级透明度削弱飞走动画
  const raw = $("#rawPack");
  if (raw) {
    raw.style.transition = "opacity .5s ease .3s";
    raw.style.opacity = "0";
    raw.style.pointerEvents = "none";
  }

  // 升起到位后收尾
  setTimeout(() => {
    if (!pack.cracker && pack.card && pack.card.rarity === "SSR") {
      const tc = $("#reveal .tcard");
      if (tc) tc.classList.add("pulse");
      toast("闪光 SSR「" + pack.card.name + "」");
    }
    state.busy = false;
    updateNextBtn();
    const allDone = state.packs.every(p => p.opened);
    $("#flipHint").innerHTML = allDone
      ? "全部集齐 · 即将揭晓今日运势"
      : (pack.cracker ? "苏打饼干 · 已追加一包" : "点击卡牌 · 翻转看详解");
    if (!pack.cracker) bindCardFlip(allDone);
    if (allDone) scheduleAutoFinish(3400);
  }, 820);
}

// ---------- 卡面箔光：稀有度决定箔型与强度 ----------
// 普通卡只压一层极淡的银砂（有金属感、不抢印刷）；
// R 是星点箔，SR 是冷调碎冰箔，SSR 是暖金锻箔 —— 越稀有，箔越"贵"。
const HOLO_BY_RARITY = {
  C:   { preset: "glitter", scale: 2.00, intensity: 0.14, edgeSparkle: 0.30, foilColor: "#c9d2df" },
  R:   { preset: "stars",   scale: 3.60, intensity: 0.24, edgeSparkle: 0.46, foilColor: "#cfe0ff" },
  SR:  { preset: "stars",   scale: 4.40, intensity: 0.34, edgeSparkle: 0.70, foilColor: "#dcc8ff" },
  SSR: { preset: "shards",  scale: 3.80, intensity: 0.46, edgeSparkle: 0.90, foilColor: "#ffd76a" },
};
let revealHolo = null;
let zoomHolo = null;

function mountHolo(rv, card) {
  if (revealHolo) { revealHolo.destroy(); revealHolo = null; }
  if (!window.WhiteBoxHolo || !card || !rv) return;
  const tcard = rv.querySelector(".tcard");
  if (!tcard) return;
  const conf = HOLO_BY_RARITY[card.rarity] || HOLO_BY_RARITY.C;
  revealHolo = window.WhiteBoxHolo.attach(tcard, Object.assign({}, conf, {
    tiltEl: rv.querySelector(".tiltbox"),
    trackEl: rv,
    flipEl: rv.querySelector(".flip"),
    tiltMax: 10,
    hoverScale: 1.025,
    glare: 0.42,
    radius: 9
  }));
}

// 收藏页点开的大图：同一张卡，同样的箔
function mountZoomHolo(card) {
  if (zoomHolo) { zoomHolo.destroy(); zoomHolo = null; }
  if (!window.WhiteBoxHolo || !card) return;
  const wrap = document.querySelector("#zoomBody .zoom-card");
  const tcard = wrap && wrap.querySelector(".tcard");
  if (!tcard) return;
  const conf = HOLO_BY_RARITY[card.rarity] || HOLO_BY_RARITY.C;
  zoomHolo = window.WhiteBoxHolo.attach(tcard, Object.assign({}, conf, {
    tiltEl: wrap,
    trackEl: wrap,
    tiltMax: 12,
    hoverScale: 1,
    glare: 0.42,
    radius: 9
  }));
}

function renderReveal(card, label) {
  const stage = $("#stage");
  const rv = document.createElement("div");
  rv.className = "reveal";
  rv.id = "reveal";
  rv.innerHTML = `
    <div class="tiltbox" id="tiltbox">
      <div class="flip" id="flip">
        <div class="fc front">${cardHTML(card, label)}</div>
        <div class="fc back">${cardDetailHTML(card, label)}</div>
      </div>
    </div>`;
  stage.appendChild(rv);

  // 卡面箔光：撕开之后这张牌得有金属箔的反光
  mountHolo(rv, card);

  // 从包口下方升起到正中（rAF 启动 + setTimeout 兜底，防止无头环境 rAF 不触发）
  const rise = () => rv.classList.add("rised");
  requestAnimationFrame(() => requestAnimationFrame(rise));
  setTimeout(rise, 120);

  renderBars();
}
