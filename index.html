// ---------- 出卡之后 ----------
function nextAfterReveal() {
  if (state.busy) return;
  clearAutoFinish();
  if (state.packs.every(p => p.opened)) {
    finishDraw();
    return;
  }
  // 找下一个未开的包
  const n = state.packs.length;
  let next = -1;
  for (let k = 1; k <= n; k++) {
    const i = (state.activePack + k) % n;
    if (!state.packs[i].opened) { next = i; break; }
  }
  if (next < 0) { finishDraw(); return; }
  // 直接切到下一包，不做全屏转场
  goDraw(next);
}

// ---------- 收尾 ----------
function finishDraw() {
  clearAutoFinish();
  const cards = state.packs.filter(p => p.card).map(p => ({ id: p.card.id, slot: p.label }));
  const score = state.packs.reduce((s, p) => s + (p.card ? p.card.score : 0), 0);
  const tier = getTier(score);

  localStorage.setItem(LS.date, todayStr());
  localStorage.setItem(LS.cards, JSON.stringify(cards));

  const hist = JSON.parse(localStorage.getItem(LS.hist) || "[]");
  if (!hist.some(h => h.date === todayStr())) {
    hist.unshift({ date: todayStr(), ids: cards.map(c => c.id), score, grade: tier.grade, label: tier.label });
    localStorage.setItem(LS.hist, JSON.stringify(hist.slice(0, 60)));
  }

  // 直接进收藏页，不做全屏转场
  renderResult();
  state.busy = false;
}

// ---------- 结果 / 收藏页 ----------
function renderResult() {
  if (!state.packs.some(p => p.card)) loadToday();
  const cards = state.packs.filter(p => p.card);
  preloadEmojis(cards);   // 提前光栅化海报要用的 emoji 位图
  const score = cards.reduce((s, p) => s + p.card.score, 0);
  const tier = getTier(score);

  $("#resHead").textContent = "WhiteBox · " + fmtDateCN(todayStr());
  $("#resSub").textContent = cards.length + " 张卡牌已加入收藏";

  $("#resGrid").innerHTML = cards.map((p, i) => `
    <div class="rg-item" data-i="${i}" style="animation-delay:${i * 70}ms">
      <div class="rg-wrap">${cardHTML(p.card, p.label)}</div>
      <div class="rg-label"><span class="rg-p">${p.label}</span><span class="rg-n">${p.card.name}</span></div>
    </div>`).join("");

  $$("#resGrid .rg-item").forEach(el => {
    el.addEventListener("click", () => {
      const p = cards[Number(el.dataset.i)];
      openZoom(p.card, p.label);
    });
  });

  // 评级框已去掉：卡牌下方只留一句签文；拆到过苏打饼干则额外受一句眷顾
  $("#verdict").textContent = tier.text;
  const crackerHit = state.crackerFound || localStorage.getItem(LS.cracker) === "1";
  $("#crackerLine").textContent = crackerHit ? "你已受到苏打饼干之神的眷顾" : "";

  showScreen("resultScreen");
}

// ---------- 大图 ----------
function openZoom(card, label) {
  if (!card) return;
  $("#zoomBody").innerHTML = `
    <div class="zoom-card">${cardHTML(card, label)}</div>
    <div class="zoom-meta">CARD ${label} · ${card.name} · ${RARITY[card.rarity].label}</div>`;
  $("#zoomModal").classList.add("show");
  mountZoomHolo(card);
}

// ---------- 隐藏重置：左上角 WhiteBox logo（无按钮样式、无提示） ----------
function resetToday() {
  localStorage.removeItem(LS.date);
  localStorage.removeItem(LS.cards);
  localStorage.removeItem(LS.cracker);
  // 关键：饼干「多抽一包」可能把 packs 扩到 4 包，重置必须截回基础 3 包，
  // 否则下一轮没饼干也能抽四次
  if (state.packs.length > 3) state.packs.length = 3;
  state.packs.forEach(p => { p.opened = false; p.card = null; delete p.cracker; });
  state.cur = 0;
  state.busy = false;
  state.revealed = false;
  state.pending = drawThree();
  state.crackerFound = false;
  state.crackerSlot = rollCrackerSlot();
  renderHome();
  showScreen("homeScreen");
  toast("今日记录已清空");
}

// ---------- 已获得的卡牌 id：历史收藏 + 今日三张 ----------
function ownedIds() {
  const set = new Set();
  try {
    const hist = JSON.parse(localStorage.getItem(LS.hist) || "[]");
    hist.forEach(h => (h.ids || []).forEach(id => set.add(id)));
  } catch (_) {}
  try {
    JSON.parse(localStorage.getItem(LS.cards) || "[]").forEach(s => set.add(s.id));
  } catch (_) {}
  state.packs.forEach(p => { if (p.card) set.add(p.card.id); });
  return set;
}

// ---------- 海报 ----------
// 兜底地址：仅在本地预览（file:// / localhost）时用于生成二维码
const SITE_URL = "https://fanxuan0217-netizen.github.io/whitebox-daily-cards/";

function shareUrl() {
  // 线上打开时，二维码直接跟随当前完整地址（保留分享码等参数），保证扫码一定能开；
  // 本地预览时退回兜底地址。
  try {
    const loc = window.location;
    const host = loc.hostname || "";
    const local = loc.protocol === "file:" || host === "localhost" || host === "127.0.0.1";
    if (!local && /^https?:/.test(loc.origin)) {
      return loc.origin + loc.pathname + loc.search;
    }
  } catch (e) { /* 落到兜底 */ }
  return SITE_URL;
}

// 二维码画布：4 模块静区 + 整数倍放大，再交给 drawImage 平滑缩放
function makeQRCanvas(text, units) {
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const quiet = 4, total = n + quiet * 2;
  const scale = Math.max(4, Math.floor(units / total));
  const cv = document.createElement("canvas");
  cv.width = cv.height = total * scale;
  const c = cv.getContext("2d");
  c.fillStyle = "#ffffff";
  c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = "#0a1526";
  for (let r = 0; r < n; r++) {
    for (let col = 0; col < n; col++) {
      if (qr.isDark(r, col)) c.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
    }
  }
  return cv;
}

// ---------- emoji 光栅化缓存 ----------
// iOS canvas 的 fillText 画不出彩色 emoji（换过字体族仍空白），釜底抽薪：
// 先把 emoji 塞进 SVG data-URI <img> 光栅化成位图，海报里用 drawImage 贴图。
const EMOJI_CACHE = {};

function emojiSvgImg(ch, size) {
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
    '<text x="50%" y="50%" text-anchor="middle" dy=".35em" ' +
    'font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" ' +
    'font-size="' + size + '">' + ch + '</text></svg>';
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return img;
}

// 开包后预光栅化今日用到的 emoji：优先用本机烤制并打进项目的 PNG 贴图
//（EMOJI_PNG，Apple Color Emoji 同源），没有烤制记录的再用 SVG 兜底
function preloadEmojis(cards) {
  cards.forEach(p => {
    const ch = p.card && p.card.emoji;
    if (!ch || EMOJI_CACHE[ch]) return;
    let img;
    if (typeof EMOJI_PNG === "object" && EMOJI_PNG[ch]) {
      img = new Image();
      img.onload = () => { EMOJI_CACHE[ch].ok = true; };
      img.src = EMOJI_PNG[ch];
    } else {
      img = emojiSvgImg(ch, 240);
      img.onload = () => { EMOJI_CACHE[ch].ok = true; };
    }
    EMOJI_CACHE[ch] = { img, ok: false };
  });
}

// 确保海报需要的 emoji 全部光栅化完成（最多等 1.2s，超时用 fillText 兜底）
function ensureEmojis(cards) {
  preloadEmojis(cards);
  const t0 = Date.now();
  return new Promise(resolve => {
    const check = () => {
      const pending = cards.some(p => {
        const e = p.card && EMOJI_CACHE[p.card.emoji];
        return e && !e.ok;
      });
      if (!pending || Date.now() - t0 > 1200) resolve();
      else setTimeout(check, 60);
    };
    check();
  });
}

// ---------- 海报：直接复刻结果页（三卡扇形 + 签文 + 底部二维码） ----------
// 卡框渐变，与 style.css 的 .tcard[data-rarity] 一一对应
const FRAME_GRAD = {
  N:   ["#8a8a5e", "#71714a", "#5d5d39", "#4c4c2d"],
  R:   ["#8f9ec0", "#7183ab", "#5a6b93", "#5a6b93"],
  SR:  ["#a08ac8", "#8268b4", "#63509a", "#63509a"],
  SSR: ["#e8c878", "#c9a24a", "#8a6a28", "#c9a24a"],
};

// 画一张扇形卡（复刻 .tcard 结构：名/稀有度徽章/运势卡编号/插画/签文/版权行）
function drawFanCard(ctx, card, label, cx, cy, w, h, rotDeg, scale, dim) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotDeg * Math.PI / 180);
  ctx.scale(scale, scale);
  const x0 = -w / 2, y0 = -h / 2;

  // 卡框（对应 tcard 渐变 + 外阴影）
  ctx.shadowColor = "rgba(0,0,0,.75)";
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 22;
  const fg = FRAME_GRAD[card.rarity] || FRAME_GRAD.N;
  const grad = ctx.createLinearGradient(x0, y0, x0 + w * 0.35, y0 + h);
  grad.addColorStop(0, fg[0]); grad.addColorStop(0.38, fg[1]);
  grad.addColorStop(0.72, fg[2]); grad.addColorStop(1, fg[3]);
  ctx.fillStyle = grad;
  roundRect(ctx, x0, y0, w, h, 18); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "rgba(0,0,0,.35)";
  ctx.lineWidth = 2;
  roundRect(ctx, x0, y0, w, h, 18); ctx.stroke();
  // 内框（tc-frame：暗色内衬 + 微光）
  ctx.strokeStyle = "rgba(30,30,10,.45)";
  ctx.lineWidth = 2;
  roundRect(ctx, x0 + 16, y0 + 16, w - 32, h - 32, 10); ctx.stroke();

  // 卡名 + 稀有度徽章（tc-head）
  const top = y0 + 30;
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.font = "900 32px 'PingFang SC', sans-serif";
  ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillText(card.name, x0 + 22, top + 32);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const bw = 38, bx = x0 + w - 22 - bw;
  ctx.fillStyle = "rgba(20,20,8,.9)";
  roundRect(ctx, bx, top, bw, bw, 5); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.5;
  roundRect(ctx, bx, top, bw, bw, 5); ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = "#f5f0d8";
  ctx.font = "900 19px 'PingFang SC', sans-serif";
  ctx.fillText(RARITY[card.rarity].label === "N" ? "运" : RARITY[card.rarity].label, bx + bw / 2, top + 26);
  // [运势卡 · NN]
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.font = "800 17px 'PingFang SC', sans-serif";
  ctx.fillText("[运势卡 · " + label + "]", x0 + w - 22, top + 62);

  // 插画区（tc-art：径向夜蓝 + emoji 位图 + FX 签名）
  const ax = x0 + 22, ay = top + 74, aw = w - 44, ah = 168;
  const ag = ctx.createRadialGradient(ax + aw / 2, ay + ah * 0.18, 8, ax + aw / 2, ay + ah * 0.18, ah * 1.25);
  ag.addColorStop(0, "#4a7fb5"); ag.addColorStop(0.4, "#2c4f78");
  ag.addColorStop(0.72, "#16283f"); ag.addColorStop(1, "#0b1522");
  ctx.fillStyle = ag;
  roundRect(ctx, ax, ay, aw, ah, 6); ctx.fill();
  ctx.strokeStyle = "rgba(30,30,12,.55)"; ctx.lineWidth = 1.5;
  roundRect(ctx, ax, ay, aw, ah, 6); ctx.stroke();
  ctx.textAlign = "center";
  const em = EMOJI_CACHE[card.emoji];
  const E = 116;
  if (em && em.ok) {
    ctx.drawImage(em.img, ax + aw / 2 - E / 2, ay + ah / 2 - E / 2, E, E);
  } else {
    ctx.textBaseline = "middle";
    ctx.font = "116px sans-serif";
    ctx.fillText(card.emoji, ax + aw / 2, ay + ah / 2);
    ctx.textBaseline = "alphabetic";
  }
  ctx.save();
  ctx.translate(ax + aw - 14, ay + ah - 12);
  ctx.rotate(-7 * Math.PI / 180);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,.72)";
  ctx.font = "italic 700 20px 'PingFang SC', sans-serif";
  ctx.fillText("FX", 0, 0);
  ctx.restore();

  // 签文面板（tc-text：米白底 + desc + 虚线分隔 + advice）
  const pw = w - 60, px = x0 + 30, py = ay + ah + 10;
  ctx.textAlign = "left";
  ctx.font = "500 18px 'SFMono-Regular', Menlo, monospace";
  const descLines = countWrapLines(ctx, card.desc, pw - 24, 3);
  ctx.font = "400 16px 'SFMono-Regular', Menlo, monospace";
  const advLines = countWrapLines(ctx, card.advice, pw - 24, 2);
  const ph = 14 + descLines * 26 + 6 + 1 + 8 + advLines * 24 + 10;
  ctx.fillStyle = "#f1efe2";
  roundRect(ctx, px, py, pw, ph, 6); ctx.fill();
  ctx.strokeStyle = "rgba(40,40,20,.4)"; ctx.lineWidth = 1.5;
  roundRect(ctx, px, py, pw, ph, 6); ctx.stroke();
  ctx.fillStyle = "#22221a";
  ctx.font = "500 18px 'SFMono-Regular', Menlo, monospace";
  wrapText(ctx, card.desc, px + 12, py + 14 + 18, pw - 24, 26, 3);
  const dashY = py + 14 + descLines * 26 + 6;
  ctx.strokeStyle = "rgba(80,80,50,.28)";
  ctx.setLineDash([6, 5]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + 10, dashY); ctx.lineTo(px + pw - 10, dashY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#6a6a58";
  ctx.font = "400 16px 'SFMono-Regular', Menlo, monospace";
  wrapText(ctx, card.advice, px + 12, dashY + 8 + 16, pw - 24, 24, 2);

  // 版权行（tc-foot）
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,.42)";
  ctx.font = "700 11px 'PingFang SC', sans-serif";
  ctx.fillText("© 2026 WhiteBox · " + card.skill, x0 + w - 22, y0 + h - 14);

  if (dim) {
    ctx.fillStyle = "rgba(2,10,24,.16)";
    roundRect(ctx, x0, y0, w, h, 18); ctx.fill();
  }
  ctx.restore();
}

function countWrapLines(ctx, text, maxW, maxLines) {
  const chars = String(text).split("");
  let line = "", lines = 1;
  for (let i = 0; i < chars.length; i++) {
    if (ctx.measureText(line + chars[i]).width > maxW && line) {
      lines++; line = chars[i];
      if (lines >= maxLines) break;
    } else line += chars[i];
  }
  return lines;
}

function buildPoster() {
  const cards = state.packs.filter(p => p.card);
  if (!cards.length) return null;
  const score = cards.reduce((s, p) => s + p.card.score, 0);
  const tier = getTier(score);   // 总分系统已从海报移除，仅内部用于挑选神谕短句
  const W = 750, H = 1334;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#12305c"); bg.addColorStop(0.5, "#0a1c39"); bg.addColorStop(1, "#030b18");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, -60, 0, W / 2, -60, 620);
  glow.addColorStop(0, "rgba(110,170,255,.5)");
  glow.addColorStop(0.5, "rgba(60,110,200,.16)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 780);

  // 页头：与结果页 resHead 同款文字
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(190,212,246,.9)";
  ctx.font = "600 26px 'PingFang SC', sans-serif";
  ctx.fillText("WhiteBox · " + fmtDateCN(todayStr()), W / 2, 86);

  // 三卡扇形（复刻 .res-grid：左右卡 ±8° 下沉、中卡放大置顶、相邻重叠）
  const picks = cards.slice(0, 3);
  const CCW = 300, CCH = 420, SCW = 280, SCH = 392;
  const cyC = 370, cyS = 402;
  if (picks[0]) drawFanCard(ctx, picks[0].card, picks[0].label, 172, cyS, SCW, SCH, -8, 1, true);
  if (picks[2]) drawFanCard(ctx, picks[2].card, picks[2].label, 578, cyS, SCW, SCH, 8, 1, true);
  if (picks[1]) drawFanCard(ctx, picks[1].card, picks[1].label, W / 2, cyC, CCW, CCH, 0, 1, false);

  // 卡牌下方编号 + 卡名（rg-label）
  const lblY = 660, lblYs = 676;
  picks.forEach((p, i) => {
    const isMid = i === 1;
    const lx = isMid ? W / 2 : (i === 0 ? 172 : 578);
    const ly = isMid ? lblY : lblYs;
    ctx.textAlign = "left";
    ctx.font = "800 20px 'PingFang SC', sans-serif";
    const numW = ctx.measureText(p.label).width;
    ctx.font = "800 24px 'PingFang SC', sans-serif";
    const nameW = ctx.measureText(p.card.name).width;
    let x = lx - (numW + 12 + nameW) / 2;
    ctx.fillStyle = "rgba(170,196,238,.72)";
    ctx.font = "800 20px 'PingFang SC', sans-serif";
    ctx.fillText(p.label, x, ly);
    x += numW + 12;
    ctx.fillStyle = "#fff";
    ctx.font = "800 24px 'PingFang SC', sans-serif";
    ctx.fillText(p.card.name, x, ly + 1);
  });

  // 今日签文 + 饼干眷顾语（与结果页 res-line 同款）
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(216,231,255,.92)";
  ctx.font = "600 36px 'PingFang SC', sans-serif";
  wrapText(ctx, tier.text, W / 2, 772, 640, 56, 2);
  const crackerHit = state.crackerFound || localStorage.getItem(LS.cracker) === "1";
  if (crackerHit) {
    ctx.fillStyle = "#f0c96a";
    ctx.font = "700 30px 'PingFang SC', sans-serif";
    ctx.fillText("你已受到苏打饼干之神的眷顾", W / 2, 846);
  }

  // 底部二维码（缩小，不抢戏）
  const QR = 150, qx = (W - QR) / 2, qy = 930;
  const qrCv = makeQRCanvas(shareUrl(), 420);
  ctx.fillStyle = "#ffffff";
  roundRect(ctx, qx - 14, qy - 14, QR + 28, QR + 28, 14); ctx.fill();
  ctx.drawImage(qrCv, qx, qy, QR, QR);
  ctx.fillStyle = "rgba(216,232,252,.94)";
  ctx.font = "800 24px 'PingFang SC', sans-serif";
  ctx.fillText("扫码 · 抽你的今日三张", W / 2, 1146);
  ctx.fillStyle = "rgba(150,180,230,.5)";
  ctx.font = "600 17px 'PingFang SC', sans-serif";
  ctx.fillText("每天一次 · 三张运势卡", W / 2, 1184);

  return cv;
}

async function savePoster() {
  if (!state.packs.some(p => p.card)) { toast("今天还没开包"); return; }
  await ensureEmojis(state.packs);   // 等 emoji 位图就绪再画，iOS 才不会开天窗
  const cv = buildPoster();
  if (!cv) return;
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = "WhiteBox_" + todayStr() + ".png";
  a.click();
  toast("海报已生成 · 扫码即可参与");
}

function wrapText(ctx, text, cx, y, maxW, lh, maxLines) {
  const chars = String(text).split("");
  let line = "", lines = [];
  const center = ctx.textAlign === "center";
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line); line = chars[i];
      if (lines.length >= maxLines) break;
    } else line = test;
  }
  if (lines.length < maxLines && line) lines.push(line);
  lines.forEach((l, i) => {
    if (center) ctx.fillText(l, cx, y + i * lh);
    else ctx.fillText(l, cx, y + i * lh);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 今日数据 ----------
function loadToday() {
  if (localStorage.getItem(LS.date) !== todayStr()) {
    state.packs.forEach(p => { p.opened = false; p.card = null; });
    return false;
  }
  const saved = JSON.parse(localStorage.getItem(LS.cards) || "[]");
  if (!saved.length) return false;
  saved.forEach(s => {
    // 新存档用 slot 编号；兼容早期按上午/下午/夜里存的 period
    const i = (typeof s.slot === "string")
      ? state.packs.findIndex(p => p.label === s.slot)
      : PERIODS.indexOf(s.period);
    if (i >= 0) {
      const c = CARDS.find(x => x.id === s.id);
      if (c) { state.packs[i].opened = true; state.packs[i].card = c; }
    }
  });
  return true;
}

// ---------- toast ----------
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- 事件绑定 ----------
function bindEvents() {
  // 卡包本体左右滑动选包 / 轻点开启
  bindSwipe();

  // 出卡后的下一步按钮
  $("#btnNext").addEventListener("click", () => {
    if (!state.busy) nextAfterReveal();
  });

  // 顶栏
  $("#navBack").addEventListener("click", () => {
    renderHome();
    showScreen("homeScreen");
    state.busy = false;
  });
  $("#toolPool").addEventListener("click", openPool);
  $("#toolSound").addEventListener("click", () => toast("音效还没做，先静音听宇宙"));
  $("#toolMore").addEventListener("click", openPool);   // 右上角 ··· → 卡池 · 收藏

  // 左上角 logo：隐藏的重置入口（无按钮样式、无提示）
  $("#navLogo").addEventListener("click", resetToday);

  // 结果页
  $("#btnPoster").addEventListener("click", savePoster);

  // 弹窗关闭
  const closeAll = () => {
    $$(".modal-mask").forEach(m => m.classList.remove("show"));
    if (zoomHolo) { zoomHolo.destroy(); zoomHolo = null; }
  };
  $("#btnCloseZoom").addEventListener("click", closeAll);
  $("#btnClosePool").addEventListener("click", closeAll);
  $$(".modal-mask").forEach(m => {
    m.addEventListener("click", e => { if (e.target === m) closeAll(); });
  });

  // 全屏
  $("#fsBtn").addEventListener("click", () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  });

  // 键盘左右切包（桌面端便利，不依赖按钮）
  window.addEventListener("keydown", e => {
    if (!$("#homeScreen").classList.contains("active")) return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const d = e.key === "ArrowRight" ? 1 : -1;
    state.cur = (state.cur + d + state.packs.length) % state.packs.length;
    updatePositions();
  });
}

// ---------- 卡池 · 收藏（历史已合并进来，已获得卡牌标金色） ----------
function openPool() {
  const owned = ownedIds();
  const got = CARDS.filter(c => owned.has(c.id)).length;
  $("#poolHint").innerHTML = `共 20 张 · 金色为已获得 · 已收集 <b>${got} / 20</b>`;
  $("#poolGrid").innerHTML = CARDS.map(c => {
    const has = owned.has(c.id);
    return `<div class="pool-item${has ? " owned" : ""}">
      <span class="pe">${c.emoji}</span>
      <span class="pn">${c.name}</span>
      <span class="pr">${RARITY[c.rarity].label}</span>
      ${has ? '<span class="own-mark">★</span>' : ""}
    </div>`;
  }).join("");
  $("#poolModal").classList.add("show");
}

// ---------- 启动 ----------
// 「一天一次 · 一次三张」的规则已写死：当天抽完再打开直接进今日运势，
// goDraw 也会拦截重复开包；倒计时只在当天已抽完时出现。
// 测试开关：每次打开自动清空当日记录，方便反复验交互（正式对外运营时改成 false）。
const AUTO_RESET_FOR_TEST = false;

function init() {
  ensureGuest();
  if (AUTO_RESET_FOR_TEST) {
    localStorage.removeItem(LS.date);
    localStorage.removeItem(LS.cards);
    localStorage.removeItem(LS.cracker);
  }
  const drawn = loadToday();
  if (!drawn) {
    state.pending = drawThree();
    state.crackerFound = false;
    state.crackerSlot = rollCrackerSlot();
  }
  bindEvents();
  renderHome();
  startCountdown();
  // 今天已抽完 → 不回首页重抽，直接看今日运势
  if (drawn && hasToday()) {
    renderResult();
    return;
  }
  showScreen("homeScreen");
}

init();

</script>
